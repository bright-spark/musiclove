<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>YouTube</title>
    
    <link rel="stylesheet" href="../node_modules/framework7/framework7-bundle.min.css">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/thorium.min.css">
    
    <!-- Preserve any additional head content -->
    <style>
	html, body, iframe {
		  margin:0;
		  padding:0;
		  top:0;
		  left:0;
		  bottom:0;
		  right:0;
		  height:100%;
		  z-index:999999;
		}

	iframe {
		  overflow:hidden;
		  display:block;
		  width:100%;
		  border:none;
		}
  </style>
</head>
<body class="theme-dark color-theme-red">
    <div class="iframe-container">
        <iframe allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen="" id="playlistiframe" title="YouTube Dynamic Web/Mobile Playlist"></iframe>
    </div>
    
    <!-- Preserve any scripts -->
    <script>
	// Array of prepopulated strings
	var strings = [
	  "PLuWIxgNYqm0ketpCdUpLK4zjreYpDlLoE",
	  "PLuWIxgNYqm0lwRXD3Sqe2_ZryiljuW-L9",
	  "PLuWIxgNYqm0lnbXjnFF3bdEBbRHkr-R3k",
	  "PLuWIxgNYqm0mQd_Z6eYbNa8Riyjl0znGC",
	  "PLuWIxgNYqm0lXxPLZ9hBT9M46m53H5GES"
	];

	function generateRandomPlaylist() {
	  // Get a random index from the strings array
	  var randomIndex = Math.floor(Math.random() * strings.length);

	  // Get the string at the random index
	  var randomPlaylist = strings[randomIndex];

  	  // Save the playlist ID as a cookie
  	  document.cookie = "playlistID=" + randomPlaylist + "; path=/";
		
	  // Set the src attribute of the iframe to the random string
	  document.getElementById("playlistiframe").src = "https://www.youtube-nocookie.com/embed/videoseries?list=" + randomPlaylist;
	}

	// Call the function when the page loads
	window.addEventListener("load", generateRandomPlaylist);	  
    </script>
</body>
</html>
