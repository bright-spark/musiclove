<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Music Love</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Martin Myburgh" />
  <meta name="description" content="Music Love, your hub for unlimited entertainment." />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com" defer></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
    /* Initially hide the entire page */
    html, body {
      visibility: hidden;
      background-color: #000;
      height: 100%;
      margin: 0;
      font-family: 'Roboto', sans-serif;
      color: transparent;
      overflow: hidden;
    }

    .loaded body {
      visibility: visible;
      color: white;
      overflow: auto;
    }

    /* Buttons */
    .button {
      width: 9rem;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: normal;
      border-radius: 0.5rem;
      border: 1px solid #000000;
      color: #f6161c;
      background-color: transparent;
      margin-right: 0.5rem;
      cursor: pointer;
      transition: background-color 0.3s ease, color 0.3s ease;
      flex: 0 0 auto;
    }

    .button:hover {
      background-color: #000000;
      color: #f6161c;
    }

    .selected {
      border: 1px solid #f6161c;
      transform: scale(1.3);
      color: #f6161c;
    }

    /* Scrollable Button Row */
    .button-container {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: scroll;
      scroll-behavior: smooth;
      -ms-overflow-style: none;
      scrollbar-width: none;
      max-width: calc(5 * 9rem);  /* Ensure only 5 buttons (9rem each) are visible */
    }

    /* Hide scrollbar for Chrome, Safari, and Opera */
    .button-container::-webkit-scrollbar {
      display: none;
    }

    /* Arrow Styling */
    .arrow {
      background: transparent;
      border: 2px solid red;
      padding: 0.5rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .arrow:hover {
      background-color: rgba(255, 0, 0, 0.1);
    }

    .arrow svg {
      fill: red;
      width: 1.5rem;
      height: 1.5rem;
    }

    .arrow-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    /* Other CSS from the original code */
    .youtube-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      background-color: #00000077;
    }

    .youtube-iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    footer {
      background-color: #101010;
      padding: 1rem;
      text-align: center;
      color: #fff;
    }

    footer a {
      color: #f6161c;
      text-decoration: none;
    }

  </style>

</head>

<body>
  <!-- Container -->
  <div class="container mx-auto mt-4 px-4 w-full h-full font-sans font-light text-sm">

    <!-- Bio Section -->
    <div class="flex justify-center">
      <div class="w-full md:w-1/2 text-center">
        <div class="text-center mt-2 flex justify-center items-center gap-1 flex-col md:flex-row">
          <img id="profile-image" class="rounded-full" alt="Profile Image of Music Love" width="140" height="140">
        </div>
        <div class="text-3xl mt-2">
          <p>mo͞o<a class="hover:text-white-500 text-ytplus" href="https://youtube.com/@theradiostream" target="_blank" rel="noopener noreferrer">zik</a></p>
        </div>  
      </div>
    </div>

    <!-- YouTube Embed Section -->
    <div class="flex justify-center mt-10">
      <div class="w-full md:w-2/3 rounded-lg overflow-hidden">
        <div class="youtube-container">
          <iframe title="youtube-iframe" id="youtube-player" class="youtube-iframe" frameborder="0" allowfullscreen></iframe>
        </div>
      </div>
    </div>

    <!-- Button Navigation with Arrows -->
    <div class="arrow-container mt-8">
      <!-- Left Arrow -->
      <button class="arrow" onclick="scrollLeft()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>

      <!-- Scrollable Buttons Section -->
      <div class="button-container flex justify-center gap-2 px-4">
        <!-- Buttons will be dynamically added here -->
      </div>

      <!-- Right Arrow -->
      <button class="arrow" onclick="scrollRight()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>

    <!-- Spacer to push footer to bottom -->
    <div class="flex-grow"></div>

    <!-- Footer -->
    <footer class="mt-10 text-center px-4 pb-8 pt-8 gap-1 rounded-lg">
      <p>Powered by <a class="text-ytplus hover:text-white" href="https://youtube.com/@theradiostream" target="_blank" rel="noopener noreferrer">mo͞ozik</a></p>
    </footer>

    <div class="mt-4 mb-10 text-center">
      <p class="text-sm sm:text-sm text-gray-500">Made with music <a class="text-ytplus hover:text-white" href="https://youtube.com/@theradiostream" target="_blank" rel="noopener noreferrer">❤️</a> from South Africa</p>
    </div>

  </div>

  <!-- JavaScript -->
  <script>
    // JSON data for bio and playlists
    const data = {
      bio: {
        name: "John Doe",
        title: "Playlist Curator",
        description: "YouTube Plus is a curated playlist collection of the best music videos on YouTube.",
        image: "profile.png"
      },
      playlists: [
        {
          title: "Hits",
          url: "https://www.youtube.com/embed/4QIZE708gJ4?controls=0",
          auto: "https://www.youtube.com/embed/4QIZE708gJ4?controls=0&autoplay=1"
        },
        {
          title: "Pop",
          url: "https://www.youtube.com/embed/hLQl3WQQoQ0?controls=0",
          auto: "https://www.youtube.com/embed/hLQl3WQQoQ0?controls=0&autoplay=1"
        },
        {
          title: "Dance",
          url: "https://www.youtube.com/embed/ouEl3qTLc0M?controls=0",
          auto: "https://www.youtube.com/embed/ouEl3qTLc0M?controls=0&autoplay=1"
        },
        {
          title: "Club",
          url: "https://www.youtube.com/embed/evJ6gX1lp2o?controls=0",
          auto: "https://www.youtube.com/embed/evJ6gX1lp2o?controls=0&autoplay=1"
        },
        {
          title: "Ballads",
          url: "https://www.youtube.com/embed/r3Pr1_v7hsw?controls=0",
          auto: "https://www.youtube.com/embed/r3Pr1_v7hsw?controls=0&autoplay=1"
        },
        {
          title: "Chill",
          url: "https://www.youtube.com/embed/LnIU32wdbNc?controls=0",
          auto: "https://www.youtube.com/embed/LnIU32wdbNc?controls=0&autoplay=1"
        },
        {
          title: "Classics",
          url: "https://www.youtube.com/embed/5NV6Rdv1a3I?controls=0",
          auto: "https://www.youtube.com/embed/5NV6Rdv1a3I?controls=0&autoplay=1"
        }
      ]
    };

    // Load bio content
    function loadBio() {
      document.getElementById("profile-image").src = data.bio.image;
      document.getElementById("youtube-player").src = data.playlists[0].url;
    }

    // Dynamically load buttons from the playlists array
    function loadButtons() {
      const buttonContainer = document.querySelector(".button-container");

      data.playlists.forEach((playlist, index) => {
        const button = document.createElement("button");
        button.classList.add("button");
        button.textContent = playlist.title;
        button.id = `btn-${index}`;
        button.onclick = () => {
          loadPlaylist(index);
          selectButton(index);
        };
        buttonContainer.appendChild(button);
      });

      selectButton(0); // Select the first button on load
    }

    // Function to load playlist content (preroll normal followed by auto)
    function loadPlaylist(index) {
      const youtubePlayer = document.getElementById("youtube-player");
      youtubePlayer.src = data.playlists[index].url;

      // Switch to autoplay URL after 5ms
      setTimeout(() => {
        youtubePlayer.src = data.playlists[index].auto;
      }, 5);
    }

    // Function to handle button selection state
    function selectButton(selectedId) {
      document.querySelectorAll('.button').forEach((button, index) => {
        button.classList.toggle("selected", index === selectedId);
      });
    }

    // Scroll the button container to the left
    function scrollLeft() {
      const container = document.querySelector(".button-container");
      container.scrollBy({
        left: -9 * 16, // Scroll to the left by 9rem (1 button width)
        behavior: 'smooth'
      });
    }

    // Scroll the button container to the right
    function scrollRight() {
      const container = document.querySelector(".button-container");
      container.scrollBy({
        left: 9 * 16, // Scroll to the right by 9rem (1 button width)
        behavior: 'smooth'
      });
    }

    // Initialize page content
    document.addEventListener("DOMContentLoaded", () => {
      loadBio();
      loadButtons();
      document.documentElement.classList.add("loaded");
    });
  </script>

</body>

</html>
