<body>

  <iframe title="YouTube video player" id="playlistiframe" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  
  <script>
    "use strict";

    let wakeLock = null;

    const playlists = [
      "PLPmdCGqzDq0Omc-BAk9lPEzhqeEdXfKVX",
      "PLuWIxgNYqm0kV69z-SJHDwAuebGmIhbp6",
      "PLuWIxgNYqm0kQhpwU7JBbol71vOvXYJ3J",
      "PLuWIxgNYqm0mQd_Z6eYbNa8Riyjl0znGC",
      "PLuWIxgNYqm0nwE0Ysm1wnhuVwyOcdWfL-",
      "PLuWIxgNYqm0nBsE2hckbEwuFouYA2nULw",
      "PLuWIxgNYqm0mnK9qtr-fwRpKHvHoZyz2c",
      "PLuWIxgNYqm0lOshsXRm9YEll-tbvQAYa2",
      "PLuWIxgNYqm0n2iz-4exj1Ydebl0V3D-6N",
      "PLuWIxgNYqm0lTsmQBVDeOTM63og_pLAdx",
      "PLuWIxgNYqm0mJXPXGOIWc1N72Qs0Tez_E",
      "PLuWIxgNYqm0lJH4UKIFrZnyfjpnRGsxdr",
      "PLuWIxgNYqm0lXxPLZ9hBT9M46m53H5GES",
      "PLuWIxgNYqm0nzjr_Xc8CYrEZtOVmlHFZk",
      "PLuWIxgNYqm0lwRXD3Sqe2_ZryiljuW-L9",
      "PLuWIxgNYqm0ketpCdUpLK4zjreYpDlLoE",
      "PLuWIxgNYqm0lp_fJjhRiT8p0h32gmkTOB",
      "PLuWIxgNYqm0lnbXjnFF3bdEBbRHkr-R3k",
    ];

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function getNextPlaylist() {
      const currentIndex = parseInt(localStorage.getItem('currentIndex') || '-1', 10);
      const nextIndex = currentIndex === -1 ? Math.floor(Math.random() * playlists.length) : (currentIndex + 1) % playlists.length;
      localStorage.setItem('currentIndex', nextIndex);
      return playlists[nextIndex];
    }

    async function requestWakeLock() {
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => {
          console.log('Wake Lock was released');
        });
        console.log('Wake Lock is active');
      } catch (err) {
        console.error(`${err.name}, ${err.message}`);
      }
    }

    function loadPlaylist() {
      const nextPlaylist = getNextPlaylist();
      const iframe = document.getElementById('playlistiframe');
      iframe.src = `https://youtube.com/embed/playlist?list=${nextPlaylist}&start_radio=1&controls=0&showinfo=0&modestbranding=1&autoplay=0&enablejsapi=1`;

      // YouTube IFrame API ready
      iframe.onload = () => {
        const player = new YT.Player('playlistiframe', {
          events: {
            'onReady': onPlayerReady,
            'onStateChange': onPlayerStateChange
          }
        });
      };
    }

    function onPlayerReady(event) {
      const player = event.target;
      // Autoplay the video as soon as it's ready
      player.playVideo();
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        // Load the next playlist when the current video ends
        loadPlaylist();
      }
    }

    window.addEventListener('load', () => {
      requestWakeLock();
      loadPlaylist();
    });

    // Reapply the wake lock when the tab becomes visible again
    document.addEventListener('visibilitychange', () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        requestWakeLock();
      }
    });
  </script>

  <script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
