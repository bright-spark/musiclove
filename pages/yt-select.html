<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YouTube Red</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="musiclove>yt-select">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="HandheldFriendly" content="true">
  <meta name="MobileOptimized" content="320">
  <meta name="theme-color" content="#1e1e1e" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <link rel="stylesheet" href="/css/custom.css">
  <style>
    html, body, iframe {
      margin: 0;
      padding: 0;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      height: 100%;
      z-index: 2147483647;
      position: fixed;
    }

    iframe {
      overflow: hidden;
      display: block;
      width: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <iframe title="YouTube video player" id="playlistiframe" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen
    src="https://www.youtube.com/embed/videoseries?list=PLPmdCGqzDq0Omc-BAk9lPEzhqeEdXfKVX&enablejsapi=1&controls=1">
  </iframe>
  
  <script>
    "use strict";

    let player;
    let currentVideoTitle = '';

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('playlistiframe', {
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      // Fetch initial video data when the player is ready
      updateVideoMetadata();
    }

    function onPlayerStateChange(event) {
      // Update metadata when video changes
      if (event.data === YT.PlayerState.PLAYING) {
        updateVideoMetadata();
      }
    }

    function updateVideoMetadata() {
      const videoData = player.getVideoData();
      currentVideoTitle = videoData.title;

      // Fetch video ID for possible thumbnail or artwork
      const videoId = videoData.video_id;
      const artworkUrl = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;

      // Update MediaSession metadata
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: videoData.title,
          artist: 'YouTube Artist',
          album: 'YouTube Playlist',
          artwork: [
            { src: artworkUrl, sizes: '96x96', type: 'image/jpeg' },
            { src: artworkUrl, sizes: '128x128', type: 'image/jpeg' },
            { src: artworkUrl, sizes: '192x192', type: 'image/jpeg' },
            { src: artworkUrl, sizes: '256x256', type: 'image/jpeg' },
            { src: artworkUrl, sizes: '512x512', type: 'image/jpeg' }
          ]
        });

        // Set action handlers for lock screen controls
        navigator.mediaSession.setActionHandler('play', function() {
          player.playVideo();
        });

        navigator.mediaSession.setActionHandler('pause', function() {
          player.pauseVideo();
        });
      }
    }

    // Load the YouTube IFrame API
    function loadYouTubeAPI() {
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      const firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    }

    window.addEventListener('load', loadYouTubeAPI);
  </script>

</body>
</html>
