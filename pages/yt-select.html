  <iframe title="YouTube video player" id="playlistiframe" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  
  <script>
    "use strict";
  
    const playlists = [
      "PLPmdCGqzDq0Omc-BAk9lPEzhqeEdXfKVX",
      "PLuWIxgNYqm0kV69z-SJHDwAuebGmIhbp6",
			"PLuWIxgNYqm0kQhpwU7JBbol71vOvXYJ3J",
			"PLuWIxgNYqm0mQd_Z6eYbNa8Riyjl0znGC",
			"PLuWIxgNYqm0nwE0Ysm1wnhuVwyOcdWfL-",
			"PLuWIxgNYqm0nBsE2hckbEwuFouYA2nULw",
			"PLuWIxgNYqm0mnK9qtr-fwRpKHvHoZyz2c",
			"PLuWIxgNYqm0lOshsXRm9YEll-tbvQAYa2",
			"PLuWIxgNYqm0n2iz-4exj1Ydebl0V3D-6N",
			"PLuWIxgNYqm0lTsmQBVDeOTM63og_pLAdx",
			"PLuWIxgNYqm0mJXPXGOIWc1N72Qs0Tez_E",
			"PLuWIxgNYqm0lJH4UKIFrZnyfjpnRGsxdr",
			"PLuWIxgNYqm0lXxPLZ9hBT9M46m53H5GES",
			"PLuWIxgNYqm0nzjr_Xc8CYrEZtOVmlHFZk",

			"PLuWIxgNYqm0lnbXjnFF3bdEBbRHkr-R3k",
    ];

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function getNextPlaylist() {
      const currentIndex = parseInt(localStorage.getItem('currentIndex') || '-1', 10);
      const nextIndex = currentIndex === -1 ? Math.floor(Math.random() * playlists.length) : (currentIndex + 1) % playlists.length;
      localStorage.setItem('currentIndex', nextIndex);
      return playlists[nextIndex];
    }

    function getNextPlaylist1() {
      let playedPlaylists = JSON.parse(localStorage.getItem('playedPlaylists') || '[]');
      let currentIndex = parseInt(localStorage.getItem('currentIndex') || '-1', 10);

      // Reset and shuffle if all playlists are played
      if (playedPlaylists.length === playlists.length) {
        playedPlaylists = [];
        shuffleArray(playlists);
      }

      // Select a random playlist, making sure it's not the same as the last one played
      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * playlists.length);
      } while (playedPlaylists.includes(nextIndex) || nextIndex === currentIndex);

      // Update localStorage
      playedPlaylists.push(nextIndex);
      localStorage.setItem('playedPlaylists', JSON.stringify(playedPlaylists));
      localStorage.setItem('currentIndex', nextIndex);

      return playlists[nextIndex];
    }

    function loadPlaylist() {
      const nextPlaylist = getNextPlaylist();
      document.getElementById('playlistiframe').src = `https://youtube.com/embed/playlist?list=${nextPlaylist}&start_radio=1&controls=0&showinfo=0&modestbranding=1&index=2&autoplay=1&enablejsapi=1`;
    }

    window.addEventListener('load', loadPlaylist);
    
  </script>
  <script src="wakey.js"></script>
