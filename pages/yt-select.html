<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YouTube Red</title>    
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body>

  <iframe id="playlistiframe" src=`https://youtube.com/embed/?list=${nextPlaylist}&index=1&controls=0&autoplay=1`; title="YouTube Video Player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

  <script src="wakey.js"></script>

  <script>

    "use strict";
  
    const playlists = [
      "RDCLAK5uy_kmPRjHDECIcuVwnKsx2Ng7fyNgFKWNJFs", // Add more playlist IDs if needed
    ];

    function getNextPlaylist() {
      const currentIndex = parseInt(localStorage.getItem('currentIndex') || '-1', 10);
      // Randomize the first one or go sequentially after
      const nextIndex = currentIndex === -1 ? Math.floor(Math.random() * playlists.length) : (currentIndex + 1) % playlists.length;
      localStorage.setItem('currentIndex', nextIndex); // Save index for future sessions
      return playlists[nextIndex]; // Return the next playlist to be loaded
    }

    function loadPlaylist() {
      const nextPlaylist = getNextPlaylist();
      const ytPlayer = document.getElementById('playlistiframe');
      ytPlayer.src = `https://youtube.com/embed/?list=${nextPlaylist}&index=1&controls=0`;
    }

    // Ensure the playlist is loaded on window load
    window.addEventListener('load', loadPlaylist);

    document.addEventListener('DOMContentLoaded', function () {
        const ytPlayer = document.getElementById('playlistiframe');
        ytPlayer.src = ytPlayer.src + '&autoplay=1'; // Autoplay the video
    });

  </script>

</body>
</html>
