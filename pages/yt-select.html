<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YouTube Red</title>    
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body>
  <iframe title="YouTube video player" id="playlistiframe" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  <script>
    "use strict";
  
    const playlists = [
      "si=Sl8-oo5nWvOFKcBp&list=PLuWIxgNYqm0kV69z-SJHDwAuebGmIhbp6",
      "si=bi0Y6HBqUjfJpRrw&list=PLuWIxgNYqm0ketpCdUpLK4zjreYpDlLoE",
    ];
  
    function getNextPlaylist() {
      const currentIndex = parseInt(localStorage.getItem('currentIndex') || '-1', 10);
      const nextIndex = currentIndex === -1 ? Math.floor(Math.random() * playlists.length) : (currentIndex + 1) % playlists.length;
      localStorage.setItem('currentIndex', nextIndex);
      return playlists[nextIndex];
    }
  
    function loadPlaylist() {
      const nextPlaylist = getNextPlaylist();
      document.getElementById('playlistiframe').src = `https://www.youtube.com/embed/videoseries?${nextPlaylist}&start_radio=1&controls=0&showinfo=0&modestbranding=1&autoplay=1&enablejsapi=1`;
    }
  
    window.addEventListener('load', loadPlaylist);
    
  </script>
  <script src="wakey.js"></script>
</body>
</html>
