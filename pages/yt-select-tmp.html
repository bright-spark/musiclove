<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>YouTube Red</title>
    
    <link rel="stylesheet" href="../node_modules/framework7/framework7-bundle.min.css">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/thorium.min.css">
    
    <!-- Preserve any additional head content -->
    <style>
    html, body, iframe {
      margin: 0;
      padding: 0;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      height: 100%;
      z-index: 2147483647; /* Maximum z-index value */
      position: fixed;
    }

    iframe {
      overflow: hidden;
      display: block;
      width: 100%;
      border: none;
    }
  </style>
</head>
<body class="theme-dark color-theme-red">
    <div class="iframe-container">
        <iframe allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen="" id="playlistiframe" referrerpolicy="strict-origin-when-cross-origin" title="YouTube video player"></iframe>
    </div>
    
    <!-- Preserve any scripts -->
    <script>
    "use strict";
  
    const playlists = [
      "PLPmdCGqzDq0Omc-BAk9lPEzhqeEdXfKVX",
    ];

    function getNextPlaylist() {
      const currentIndex = parseInt(localStorage.getItem('currentIndex') || '-1', 10);
      const nextIndex = currentIndex === -1 ? Math.floor(Math.random() * playlists.length) : (currentIndex + 1) % playlists.length;
      localStorage.setItem('currentIndex', nextIndex);
      return playlists[nextIndex];
    }

    function loadPlaylist() {
      const nextPlaylist = getNextPlaylist();
      document.getElementById('playlistiframe').src = `https://youtube.com/embed/playlist?list=${nextPlaylist}&controls=0&rel=0&showinfo=0&modestbranding=1&autoplay=1&enablejsapi=1`;
    }

    window.addEventListener('load', loadPlaylist);
    
  </script>
    <script src="wakey.js"></script>
</body>
</html>
