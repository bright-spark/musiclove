<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>YT</title>
    
    <link rel="stylesheet" href="../node_modules/framework7/framework7-bundle.min.css">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/thorium.min.css">
    
    <!-- Preserve any additional head content -->
    <style>
    html,
    body,
    iframe {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      border: none;
    }
  </style>
</head>
<body class="theme-dark color-theme-red">
    <div class="iframe-container">
        <iframe allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen="" id="playlistiframe" referrerpolicy="strict-origin-when-cross-origin" title="YouTube Player"></iframe>
    </div>
    
    <!-- Preserve any scripts -->
    <script>
		var strings = [
			"PLPmdCGqzDq0Omc-BAk9lPEzhqeEdXfKVX",
		];

		function generateRandomPlaylist() {
			// Retrieve the playlist history from local storage
			var playlistHistory = JSON.parse(localStorage.getItem("playlistHistory")) || [];

			// Filter out recent playlists
			var availablePlaylists = strings.filter(function(playlist) {
				return !playlistHistory.includes(playlist);
			});

			// If all playlists have been played recently, reset history
			if (availablePlaylists.length === 0) {
				playlistHistory = [];
				availablePlaylists = strings.slice(); // Copy all playlists to available list
			}

			// Generate a random index
			var randomIndex = Math.floor(Math.random() * availablePlaylists.length);

			// Get the selected playlist
			var randomPlaylist = availablePlaylists[randomIndex];

			// Update the history
			playlistHistory.push(randomPlaylist);

			// Keep the history to a certain length, e.g., last 3 playlists
			if (playlistHistory.length > 3) {
				playlistHistory.shift(); // Remove the oldest playlist
			}

			// Save the updated history to local storage
			localStorage.setItem("playlistHistory", JSON.stringify(playlistHistory));

			// Set the src attribute of the iframe to the random string
			document.getElementById("playlistiframe").src = "https://www.youtube-nocookie.com/embed/videoseries?list=" + randomPlaylist + "&controls=0&rel=0&showinfo=0&modestbranding=1&autoplay=0&enablejsapi=1";
		}

		// Call the function when the page loads
		window.addEventListener("load", generateRandomPlaylist);
	</script>
    <script src="wakey.js"></script>
</body>
</html>
