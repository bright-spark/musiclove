<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Playlist Selector</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS for Dark Theme -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-black text-light">
    <div class="container mt-5">
        <!-- Bio Section -->
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <div class="card bg-dark text-light p-3">
                    <img id="profile-image" src="" class="rounded-circle mx-auto" alt="Profile Image" width="150" height="150">
                </div>
            </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="row mt-4">
            <div class="col text-center">
                <button class="btn btn-outline-danger mx-2" id="btn-0"></button>
                <button class="btn btn-outline-danger mx-2" id="btn-1"></button>
                <button class="btn btn-outline-danger mx-2" id="btn-2"></button>
                <button class="btn btn-outline-danger mx-2" id="btn-3"></button>
                
            </div>
        </div>

        <!-- Content Section with YouTube Embed -->
        <div class="row mt-4">
            <div class="col text-center mx-auto ratio ratio-16x9 d-flex flex-column justify-content-center align-items-center rounded mx-auto overflow-hidden video-container">
                <div id="content-section" class="bg-dark ratio ratio-16x9 d-flex flex-column justify-content-center align-items-center picture-in-picture w-100 h-100 text-light mx-auto overflow-hidden" allow="picture-in-picture allowfullscreen">
                    <iframe id="youtube-player"
                        width="100%" height="100%"
                        src="https://www.youtube.com/embed/"
                        title="YouTube Video Player" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen>
                    </iframe>
                </div>
            </div>
        </div>

        <!-- Footer Section -->
        <div class="row mt-4">
            <div class="col text-center">
                <p class="text-muted">&copy; 2024 YouTube Plus. All rights reserved.</p>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS (for responsive components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
