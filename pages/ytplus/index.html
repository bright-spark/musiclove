<body class="bg-black text-white">
    <div class="container mx-auto mt-10">
        <!-- Bio Section -->
        <div class="flex justify-center">
            <div class="card w-full md:w-2/3 bg-neutral text-neutral-content shadow-lg">
                <div class="card-body items-center text-center">
                    <img id="profile-image" src="" class="rounded-full" alt="Profile Image" width="150" height="150">
                </div>
            </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="flex justify-center mt-8">
            <button class="btn btn-outline border-[#ff4d4d] text-[#ff4d4d] hover:bg-[#ff4d4d] hover:text-black mx-2 unselected" id="btn-0" onclick="selectButton(0)">Button 1</button>
            <button class="btn btn-outline border-[#ff4d4d] text-[#ff4d4d] hover:bg-[#ff4d4d] hover:text-black mx-2 unselected" id="btn-1" onclick="selectButton(1)">Button 2</button>
            <button class="btn btn-outline border-[#ff4d4d] text-[#ff4d4d] hover:bg-[#ff4d4d] hover:text-black mx-2 unselected" id="btn-2" onclick="selectButton(2)">Button 3</button>
            <button class="btn btn-outline border-[#ff4d4d] text-[#ff4d4d] hover:bg-[#ff4d4d] hover:text-black mx-2 unselected" id="btn-3" onclick="selectButton(3)">Button 4</button>
        </div>

        <!-- Content Section with Responsive YouTube Embed -->
        <div class="flex justify-center mt-8">
            <div class="w-full md:w-2/3 rounded-lg overflow-hidden">
                <div class="relative" style="padding-top: 56.25%;"> <!-- 16:9 Aspect Ratio -->
                    <iframe id="youtube-player"
                        class="absolute top-0 left-0 w-full h-full"
                        src="https://www.youtube.com/embed/"
                        title="YouTube Video Player" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen>
                    </iframe>
                </div>
            </div>
        </div>

        <!-- Footer Section -->
        <div class="text-center mt-8">
            <p class="text-gray-400">&copy; 2024 YouTube Plus. All rights reserved.</p>
        </div>
    </div>
