<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Music Love</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Martin Myburgh" />
    <meta name="description" content="Music Love, your hub for unlimited entertainment." />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com" defer></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>
        html, body {
            background-color: #000;
            height: 100%;
            margin: 0;
            font-family: 'Roboto', sans-serif;
            color: transparent;
        }

        /* Buttons */
        .button {
            width: 9rem;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: bold;
            border-radius: 0.5rem;
            border: 1px solid #000000;
            color: #ff4d4d;
            background-color: transparent;
            margin-right: 0.5rem;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .button:hover {
            background-color: rgba(255, 0, 0, 0.7);
            color: black;
        }

        .selected {
            background-color: rgba(255, 0, 0, 0.3);
            border: 1px solid #ff4d4d;
            transform: scale(1.3); /* Slightly larger */
         
        }

        @media (max-width: 640px) {
            .button {
                width: 7rem;
                padding: 0.25rem 0.5rem;
                font-size: 0.75rem;
            }
        }

        @media (min-width: 768px) {
            .button {
                width: 10rem;
            }
        }

        /* YouTube Embed */
        .youtube-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }

        .youtube-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Footer */
        footer {
            background-color: #101010;
            padding: 1rem;
            text-align: center;
            color: #fff;
            font-size: 0.875rem;
        }

        footer p {
            margin: 0;
        }
    </style>
</head>

<body>
    <!-- Container -->
    <div class="container mx-auto mt-2 px-4 w-full h-full bg-[#000000] text-white font-sans font-light text-sm">
        
        <!-- Bio Section -->
        <div class="flex justify-center">
            <div class="w-full md:w-1/2 bg-[#000000] rounded-lg overflow-hidden mt-8 text-center">
                <div class="text-center mb-0 mt-4 bg-[#000000] rounded flex justify-center items-center gap-1 flex-col md:flex-row">
                    <img id="profile-image" src="profile.png" class="rounded-full" alt="Profile Image of Music Love" width="150" height="150">
                    <div>
                        <div class="text-2xl mt-2 mb-1">
                            <a class="text-[#ff4d4d] hover:text-white" href="https://youtube.com/@theradiostream" target="_blank" rel="noopener noreferrer">mo͞ozik</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- YouTube Embed Section -->
        <div class="flex justify-center mt-8">
            <div class="w-full md:w-2/3 rounded-lg overflow-hidden">
                <div class="youtube-container">
                    <iframe id="youtube-player" class="youtube-iframe" src="https://www.youtube.com/embed/dQw4w9WgXcQ"
                        title="YouTube Video Player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                </div>
            </div>
        </div>

        <!-- Buttons Section -->
        <div class="flex justify-center mt-8">
            <button class="button selected" id="btn-0" onclick="selectButton(0)">Button 1</button>
            <button class="button" id="btn-1" onclick="selectButton(1)">Button 2</button>
            <button class="button" id="btn-2" onclick="selectButton(2)">Button 3</button>
            <button class="button" id="btn-3" onclick="selectButton(3)">Button 4</button>
        </div>

        <!-- Footer -->
        <footer class="mt-8">
            <p>Made with ❤️ in South Africa</p>
        </footer>

    </div>

    <!-- JavaScript (deferred for loading after page) -->
    <script defer src="script.js"></script>

</body>

</html>
