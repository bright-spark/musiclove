<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>YouTube Red</title>
    
    <link rel="stylesheet" href="../node_modules/framework7/framework7-bundle.min.css">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/thorium.min.css">
    
    <!-- Preserve any additional head content -->
    <style>
    html, body, iframe {
      margin: 0;
      padding: 0;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      height: 100%;
      z-index: 2147483647;
      position: fixed;
    }

    iframe {
      overflow: hidden;
      display: block;
      width: 100%;
      border: none;
    }
  </style>
</head>
<body class="theme-dark color-theme-red">
    <div class="iframe-container">
        <iframe allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen="" id="playlistiframe" referrerpolicy="strict-origin-when-cross-origin" title="YouTube video player"></iframe>
    </div>
    
    <!-- Preserve any scripts -->
    <script>
    "use strict";

    let wakeLock = null;
    let player = null;

    const playlists = [
      "PLPmdCGqzDq0Omc-BAk9lPEzhqeEdXfKVX",
      "PLuWIxgNYqm0kV69z-SJHDwAuebGmIhbp6",
      "PLuWIxgNYqm0kQhpwU7JBbol71vOvXYJ3J",
      "PLuWIxgNYqm0mQd_Z6eYbNa8Riyjl0znGC",
      "PLuWIxgNYqm0nwE0Ysm1wnhuVwyOcdWfL-",
      "PLuWIxgNYqm0nBsE2hckbEwuFouYA2nULw",
      "PLuWIxgNYqm0mnK9qtr-fwRpKHvHoZyz2c",
      "PLuWIxgNYqm0lOshsXRm9YEll-tbvQAYa2",
      "PLuWIxgNYqm0n2iz-4exj1Ydebl0V3D-6N",
      "PLuWIxgNYqm0lTsmQBVDeOTM63og_pLAdx",
      "PLuWIxgNYqm0mJXPXGOIWc1N72Qs0Tez_E",
      "PLuWIxgNYqm0lJH4UKIFrZnyfjpnRGsxdr",
      "PLuWIxgNYqm0lXxPLZ9hBT9M46m53H5GES",
      "PLuWIxgNYqm0nzjr_Xc8CYrEZtOVmlHFZk",
      "PLuWIxgNYqm0lwRXD3Sqe2_ZryiljuW-L9",
      "PLuWIxgNYqm0ketpCdUpLK4zjreYpDlLoE",
      "PLuWIxgNYqm0lp_fJjhRiT8p0h32gmkTOB",
      "PLuWIxgNYqm0lnbXjnFF3bdEBbRHkr-R3k",
    ];

    function getNextPlaylist() {
      const currentIndex = parseInt(localStorage.getItem('currentIndex') || '-1', 10);
      const nextIndex = currentIndex === -1 ? Math.floor(Math.random() * playlists.length) : (currentIndex + 1) % playlists.length;
      localStorage.setItem('currentIndex', nextIndex);
      return playlists[nextIndex];
    }

    async function requestWakeLock() {
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => {
          console.log('Wake Lock was released');
        });
        console.log('Wake Lock is active');
      } catch (err) {
        console.error(`${err.name}, ${err.message}`);
      }

      // Force play when wake lock is requested
      if (player) {
        player.playVideo();
      }
    }

    function loadPlaylist() {
      const nextPlaylist = getNextPlaylist();
      const iframe = document.getElementById('playlistiframe');
      iframe.src = `https://youtube.com/embed/playlist?list=${nextPlaylist}&controls=0&rel=0&showinfo=0&modestbranding=1&enablejsapi=1`;

      // YouTube IFrame API ready
      iframe.onload = () => {
        player = new YT.Player('playlistiframe', {
          events: {
            'onReady': onPlayerReady,
            'onStateChange': onPlayerStateChange
          }
        });
      };
    }

    function onPlayerReady(event) {
      player = event.target;
      // Force play as soon as player is ready
      player.playVideo();
    }

    function onPlayerStateChange(event) {
      const state = event.data;
      
      // If video is paused or stopped, force play again
      if (state === YT.PlayerState.PAUSED || state === YT.PlayerState.ENDED) {
        player.playVideo();
      }

      // Load next playlist when current video ends
      if (state === YT.PlayerState.ENDED) {
        loadPlaylist();
      }
    }

    window.addEventListener('load', () => {
      requestWakeLock();
      loadPlaylist();
    });

    // Reapply the wake lock when the tab becomes visible again
    document.addEventListener('visibilitychange', () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        requestWakeLock();
      }
    });
  </script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
