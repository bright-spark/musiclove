<style>
phone {
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
background-color: #f0f0f0;
}
.phone-frame {
width: 340px;
height: 640px;
border: 16px solid black;
border-radius: 36px;
box-shadow: 0 0 10px rgba(0,0,0,0.5);
position: relative;
background-color: white;
}
.phone-notch {
width: 100px;
height: 30px;
background-color: black;
position: absolute;
top: -16px;
left: 50%;
transform: translateX(-50%);
border-radius: 0 0 20px 20px;
}
.phone-screen {
width: calc(100% + 1px);
height: calc(100% - 30px);
position: absolute;
top: 30px;
overflow: hidden;
}
.phone-screen iframe {
width: 100%;
height: 100%;
border: none;
overflow: hidden;
}
.phone-home-button {
width: 60px;
height: 60px;
background-color: black;
border-radius: 50%;
position: absolute;
bottom: 16px;
left: 50%;
transform: translateX(-50%);
display: none;
}
.view {
border-radius: 0 0 20px 20px;
}
.iframe-container {
position: relative;
width: 100%;
height: 7vh;
padding-bottom: 76vh;
overflow: hidden;
}
.iframe-container iframe {
position: absolute;
top: 0;
left: 0;
width: 111%;
height: 111%;
transform: scale(0.9);
transform-origin: 0 0;
}
</style>

<phone>
<div class="phone-frame">
<div class="phone-notch"></div>
<div class="phone-screen">
<div class="iframe-container">
<iframe class="view" src="index.html" frameborder="0"></iframe>
</div>
</div>
<div class="phone-home-button"></div>
</div>
</phone>
