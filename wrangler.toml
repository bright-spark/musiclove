name = "musiclove"

main = 'src/index.ts'
compatibility_date = '2026-05-07'

routes = [
  { pattern = "theradio.fm/*", zone_name = "theradio.fm" },
  { pattern = "www.theradio.fm/*", zone_name = "theradio.fm" }
]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
