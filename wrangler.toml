name = "musiclove"
account_id = "58b1b19c68acaef9ec1347796c8ef5dc"

main = 'src/index.ts'
compatibility_date = '2026-05-07'

routes = [
  { pattern = "theradio.fm/*", zone_name = "theradio.fm" },
  { pattern = "www.theradio.fm/*", zone_name = "theradio.fm" }
]

# Host the repo as static files so /js/*, /css/*, /pages/*, etc. resolve on theradio.fm.
# run_worker_first: handle /, /app, and OG proxy in the Worker before any asset fallback.
[assets]
directory = "deploy-static"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
