<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <title>Music Love</title>
        <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
        <meta name="author" content="Martin Myburgh"/>
        <meta name="description" content="Music Love, your hub for unlimited entertainment."/>
        <!-- Favicon -->
        <link rel="icon" href="/favicon.ico"/>
        <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
        <!-- Tailwind CSS -->
        <link href="tailwind_theme/tailwind.css" rel="stylesheet" type="text/css"/>
        <style>
    
    .container {
    	background-color: #222111;
    }

    .button {
      width: 9rem;
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      font-weight: normal;
      border-radius: 0.4rem;
      border: 1px solid transparent;
      color: #f6161c;
      background-color: transparent;
      margin-right: 0.5rem;
      cursor: pointer;
      transition: font-size 0.3s ease, color 0.3s ease, border 0.3s ease;
      flex: 0 0 auto;
    }

    .button:hover {
      background-color: #000000;
      color: #f6161c;
    }

    .selected {
      font-size: 1.3rem;
      border: 1px solid #f6161c;
    }

    .button-container {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: hidden;
      overflow-y: hidden;
      scroll-behavior: smooth;
      max-width: 100%;
      position: relative;
    }

    .arrow {
      background: transparent;
      padding: 0.5rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .arrow:hover {
      background-color: rgba(255, 0, 0, 0.1);
    }

    .arrow svg {
      fill: red;
      width: 1.7rem;
      height: 1.7rem;
    }

    .arrow-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      overflow: hidden;
    }

    .youtube-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      background-color: #00000077;
    }

    .youtube-iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    footer {
      background-color: #101010;
      padding: 1rem;
      text-align: center;
      color: #fff;
      overflow: hidden;
    }

    footer a {
      color: #f6161c;
      text-decoration: none;
    }
    
    .text-ytplus {
      color: #f6161c;
      text-decoration: none;
    }

    @media (max-width: 1024px) {
      .button {
        width: 7rem;
        padding: 0.4rem 0.8rem;
        font-size: 0.9rem;
      }
    }

    @media (max-width: 768px) {
      .button {
        width: 6rem;
        padding: 0.3rem 0.6rem;
        font-size: 0.8rem;
      }

      .arrow svg {
        width: 1.4rem;
        height: 1.4rem;
      }
    }

    @media (max-width: 480px) {
      .button {
        width: 5rem;
        padding: 0.25rem 0.5rem;
        font-size: 0.7rem;
      }

      .arrow svg {
        width: 1.2rem;
        height: 1.2rem;
      }
    }
    
  </style>
    </head>
    <body class="flex ">
        <div class="container font-light font-sans mx-auto my-0 p-4 text-sm">
            <!-- Bio Section -->
            <div class="flex justify-center">
                <div class="w-full md:w-1/2 text-center">
                    <div class="flex flex-col items-center justify-center text-center md:flex-row">
                        <img id="profile-image" class="p-2 rounded-full" alt="Profile Image of Music Love" width="140" height="140">
                    </div>
                    <div class="text-3xl">
                        <p class="pb-8 pt-4"><a class="text-ytplus hover:text-white" href="https://youtube.com/@theradiostream" target="_blank" rel="noopener noreferrer">mo͞o</a><a class="text-ytplus hover:text-white" href="https://youtube.com/@theradiostream" target="_blank" rel="noopener noreferrer">zik</a></p>
                    </div>                     
                </div>
            </div>
            <!-- YouTube Embed Section -->
            <div class="flex justify-center">
                <div class="w-full md:w-2/3 rounded-lg overflow-hidden">
                    <div class="youtube-container">
                        <iframe title="youtube-iframe" id="youtube-player" class="youtube-iframe" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" origin="https://theradio.fm" allowfullscreen></iframe>
                    </div>
                </div>
            </div>
            <!-- Button Navigation with Arrows -->
            <div class="arrow-container mx-auto py-2">
                <!-- Left Arrow -->
                <button class="arrow" id="left-arrow">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M15 18l-6-6 6-6"/>
                    </svg>
                </button>
                <!-- Scrollable Buttons Section -->
                <div class="button-container flex justify-center gap-2 px-4" id="button-container">
                    <!-- Buttons will be dynamically added here -->
                </div>
                <!-- Right Arrow -->
                <button class="arrow" id="right-arrow">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M9 6l6 6-6 6"/>
                    </svg>
                </button>
            </div>
            <!-- Footer -->
            <div class="flex-grow"></div>
            <footer class="text-center px-4 pb-8 pt-8 gap-1 rounded-lg">
                <p>Powered by <a class="text-ytplus hover:text-white" href="https://youtube.com/@theradiostream" target="_blank" rel="noopener noreferrer">mo͞ozik</a></p>
            </footer>
            <div class="py-2">
                <p class="text-center text-xs sm:text-sm text-gray-500">Made with music <a class="text-ytplus hover:text-white" href="https://youtube.com/@theradiostream" target="_blank" rel="noopener noreferrer">❤️</a> from South Africa</p>
            </div>
        </div>
    </body>
</html>
